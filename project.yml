name: Habitos
options:
  bundleIdPrefix: com.marcosznl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: pt-BR

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or in Xcode › Signing & Capabilities).
    # App Groups — and therefore the interactive widget — need a real team.
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Habitos:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: HabitosWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hábitos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Marcos"
        HabitosAppGroupIdentifier: $(TeamIdentifierPrefix)com.marcosznl.habitos
        NSCalendarsFullAccessUsageDescription: O app Hábitos grava seus blocos de foco no Calendário e mostra a agenda do dia.
        NSCalendarsUsageDescription: O app Hábitos grava seus blocos de foco no Calendário e mostra a agenda do dia.
        NSRemindersFullAccessUsageDescription: O app Hábitos sincroniza seus hábitos diários com o app Lembretes.
        NSRemindersUsageDescription: O app Hábitos sincroniza seus hábitos diários com o app Lembretes.
        CFBundleURLTypes:
          - CFBundleURLName: com.marcosznl.habitos
            CFBundleURLSchemes: [habitos]
    entitlements:
      path: App/Habitos.entitlements
      properties:
        # Sem sandbox: o banco fica em ~/Library/Mobile Documents/com~apple~CloudDocs/Hábitos.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.marcosznl.habitos
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcosznl.habitos
        PRODUCT_NAME: Hábitos
        PRODUCT_MODULE_NAME: Habitos
        EXECUTABLE_NAME: Habitos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  HabitosWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hábitos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HabitosAppGroupIdentifier: $(TeamIdentifierPrefix)com.marcosznl.habitos
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HabitosWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.marcosznl.habitos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcosznl.habitos.widget
        PRODUCT_NAME: HabitosWidget
        SKIP_INSTALL: YES
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks

schemes:
  Habitos:
    build:
      targets:
        Habitos: all
        HabitosWidget: all
    run:
      config: Debug
    archive:
      config: Release
